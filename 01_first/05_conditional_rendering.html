<html>
<head>
	<meta charset="utf-8">
	<script src="https://unpkg.com/vue@3"></script>
</head>
<body>
	<div id="app">
		<input type="checkbox" id="checkbox" v-model="checked"> <br/>
		<span v-if="checked">Checkbox selected</span>
		<span v-else>Checkbox NOT selected</span> <br/> <!-- v-else muss direkt auf das Element mit v-if folgen -->
	</div>

<script>
const { createApp } = Vue

createApp({
	data() {
		return { //Deklaration der Variablen nicht vergessen!!
			checked : false,
		}
	}
}).mount('#app')
</script>
</body>
</html>
