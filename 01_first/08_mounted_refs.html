<html>
<head>
	<meta charset="utf-8">
	<script src="https://unpkg.com/vue@3"></script>
</head>
<body>
	<div id="app">
		<p ref="p1" id="x">Die Komponente ist noch nicht im DOM eingehängt</p>
	</div>

<script>
const { createApp } = Vue

createApp({
	data() {
		return {
		}
	},
	mounted() //Wird aufgerufen, sobald die Komponente ins DOM eingehängt wurde (ab jetzt sind die refs verfügbar)
	{
		this.$refs.p1.innerHTML = "Aber jetzt ist die Komponente <b>vollständig</b> eingehängt";
		console.log(this.$refs.p1.parentElement);
		console.log(this.$refs.p1.children);
		console.log(this.$refs.p1.id);
	}
}).mount('#app')
</script>
</body>
</html>
