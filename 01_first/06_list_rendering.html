<html>
<head>
	<meta charset="utf-8">
	<script src="https://unpkg.com/vue@3"></script>
</head>
<body>
	<div id="app">
		<input type="text" v-model="user_name" placeholder="Name">

		Abteilung:
		<select v-model="department">
			<option v-for="d in departments" :key="d" :value="d">{{d}}</option>
		</select>
		<button @click="add"> neu</button>
		<fieldset>
			<legend>Alle Benutzer:</legend>
			<span v-for="(u, i) in users" :key="i">
				<!-- in Attributen funktioniert {{ }} nicht, dort wird v-bind (:) verwendet -->
				<label><input type="checkbox" :name="u.user_name" :value="u.user_name">{{u.user_name}} ({{u.department}})</label><br>
			</span>
		</fieldset>
	</div>

<script>
const { createApp } = Vue

createApp({
	data() {
		return { //Deklaration der Variablen nicht vergessen!!
			departments : ['IT', 'SALES', 'R&D'],
			users : [],
			user_name : '',
			department : '',
		}
	},
	methods:
			{
				add()
				{
					this.users.push({'user_name' : this.user_name, 'department' : this.department});
				}
			}
}).mount('#app')
</script>
</body>
</html>
